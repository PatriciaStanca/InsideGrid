name: Verify InsideGrid
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/CvDatabase.Web/package-lock.json
      - run: npm ci
        working-directory: src/CvDatabase.Web
      - run: npm test
        working-directory: src/CvDatabase.Web
      - run: npm run build
        working-directory: src/CvDatabase.Web
